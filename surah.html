<!DOCTYPE html>
<html dir="rtl" lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سورہ کی آڈیوز — الاحسان آن لائن اکیڈمی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0f2a24; --bg-panel:#153931; --bg-panel-2:#1c463c;
    --gold:#c9a24b; --gold-soft:#e3c887; --cream:#f3ede0; --sage:#8fb3a4;
    --line:rgba(243,237,224,0.14); --header-bg:rgba(15,42,36,0.92); --radius:14px;
  }
  html[data-theme="blue"]{
    --bg-deep:#0d1b2e; --bg-panel:#132840; --bg-panel-2:#1a3454;
    --gold:#c7cedd; --gold-soft:#e7ebf3; --cream:#eef1f7; --sage:#8fa3c2;
    --line:rgba(238,241,247,0.14); --header-bg:rgba(13,27,46,0.92);
  }
  html[data-theme="maroon"]{
    --bg-deep:#2c1015; --bg-panel:#3a161c; --bg-panel-2:#4a1d24;
    --gold:#d4a24b; --gold-soft:#eac887; --cream:#f3e7e0; --sage:#c79488;
    --line:rgba(243,231,224,0.14); --header-bg:rgba(44,16,21,0.92);
  }
  html[data-theme="teal"]{
    --bg-deep:#082826; --bg-panel:#0e3a37; --bg-panel-2:#134b47;
    --gold:#d9895e; --gold-soft:#f0b28c; --cream:#eef3f1; --sage:#7fb6ad;
    --line:rgba(238,243,241,0.14); --header-bg:rgba(8,40,38,0.92);
  }
  html[data-theme="charcoal"]{
    --bg-deep:#18191c; --bg-panel:#212327; --bg-panel-2:#2b2e33;
    --gold:#5fc79a; --gold-soft:#8fe0bd; --cream:#eceeee; --sage:#8a9490;
    --line:rgba(236,238,238,0.14); --header-bg:rgba(24,25,28,0.92);
  }
  html[data-theme="light"]{
    --bg-deep:#f7faf8; --bg-panel:#ffffff; --bg-panel-2:#eaf3ee;
    --gold:#2f7d55; --gold-soft:#1f6a45; --cream:#1c2b24; --sage:#5f7568;
    --line:rgba(28,43,36,0.13); --header-bg:rgba(255,255,255,0.92);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{ background:var(--bg-deep); color:var(--cream); font-family:'Noto Naskh Arabic','Noto Nastaliq Urdu',serif; line-height:2; overflow-x:hidden; }
  h1,h2,h3,.nastaliq{font-family:'Noto Nastaliq Urdu',serif; font-weight:700;}

  header{ position:sticky; top:0; z-index:50; background:var(--header-bg); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .nav-wrap{ max-width:1180px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{ width:46px; height:46px; border-radius:50%; border:2px solid var(--gold); display:flex; align-items:center; justify-content:center; font-family:'Noto Nastaliq Urdu',serif; color:var(--gold-soft); font-size:20px; }
  .brand-name{font-family:'Noto Nastaliq Urdu',serif; font-size:22px; color:var(--gold-soft);}
  nav ul{list-style:none; display:flex; gap:28px; flex-wrap:wrap;}
  nav a{color:var(--cream); text-decoration:none; font-size:16px; opacity:.85; transition:opacity .2s, color .2s;}
  nav a:hover, nav a:focus-visible{opacity:1; color:var(--gold-soft);}
  .theme-switcher{ display:flex; align-items:center; gap:8px; }
  .theme-switcher span.ts-label{ font-size:12px; color:var(--sage); margin-left:2px; }
  .theme-dot{ width:22px; height:22px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; display:inline-block; transition:transform .15s, border-color .15s; }
  .theme-dot:hover{ transform:scale(1.12); }
  .theme-dot.active{ border-color:var(--cream); }

  .page-wrap{ max-width:900px; margin:0 auto; padding:50px 24px 90px; }
  .back-link{
    display:inline-flex; align-items:center; gap:8px; color:var(--gold-soft); text-decoration:none;
    font-size:15px; margin-bottom:26px; border:1px solid var(--line); padding:8px 18px; border-radius:999px; cursor:pointer;
  }
  .back-link:hover{border-color:var(--gold);}

  .surah-header{ text-align:center; margin-bottom:34px; }
  .surah-header .snum{
    display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px;
    border:1px solid var(--gold); border-radius:50%; color:var(--gold-soft); font-size:16px; margin-bottom:12px;
  }
  .surah-header h2{ font-size:32px; color:var(--gold-soft); margin-bottom:6px; }
  .surah-header .smeta{ color:var(--sage); font-size:15px; }

  .tabs{ display:flex; gap:10px; justify-content:center; margin-bottom:26px; flex-wrap:wrap; }
  .tab-btn{
    background:var(--bg-panel); border:1px solid var(--line); color:var(--cream);
    padding:11px 26px; border-radius:999px; font-size:16px; cursor:pointer; font-family:inherit;
    transition:border-color .2s, color .2s, background .2s;
  }
  .tab-btn.active{ border-color:var(--gold); color:var(--gold-soft); background:var(--bg-panel-2); }

  .audio-list{ display:flex; flex-direction:column; gap:14px; }
  .audio-item{ background:var(--bg-panel); border:1px solid var(--line); border-radius:12px; padding:18px 22px; }
  .audio-item .aname{ color:var(--gold-soft); font-size:17px; margin-bottom:8px; display:block; }
  .audio-actions{ display:flex; gap:10px; margin-top:8px; }
  .icon-btn{ display:flex; align-items:center; justify-content:center; gap:6px; background:var(--bg-panel-2); border:1px solid var(--line); color:var(--cream); border-radius:8px; padding:9px 14px; font-size:14px; cursor:pointer; text-decoration:none; font-family:inherit; transition:border-color .2s, color .2s; }
  .icon-btn:hover{border-color:var(--gold); color:var(--gold-soft);}
  audio{width:100%; margin-top:4px; height:34px;}
  .empty-note{ color:var(--sage); font-size:15px; text-align:center; padding:30px 14px; border:1px dashed var(--line); border-radius:12px; }
  ::selection{background:var(--gold); color:#16302b;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<header>
  <div class="nav-wrap">
    <div class="brand">
      <div class="brand-mark">ا</div>
      <div class="brand-name">الاحسان آن لائن اکیڈمی</div>
    </div>
    <nav>
      <ul>
        <li><a href="index.html#about">ہمارے بارے میں</a></li>
        <li><a href="index.html#courses">دورہ جات</a></li>
        <li><a href="quran.html">آڈیو لائبریری</a></li>
        <li><a href="index.html#register">رجسٹریشن</a></li>
      </ul>
    </nav>
    <div class="theme-switcher">
      <span class="ts-label">تھیم</span>
      <button class="theme-dot active" data-theme="default" style="background:linear-gradient(135deg,#0f2a24,#c9a24b);" onclick="setTheme('default')" title="سبز و سنہری" aria-label="سبز و سنہری تھیم"></button>
      <button class="theme-dot" data-theme="light" style="background:linear-gradient(135deg,#ffffff,#2f7d55);" onclick="setTheme('light')" title="سفید و سبز" aria-label="سفید و سبز تھیم"></button>
      <button class="theme-dot" data-theme="blue" style="background:linear-gradient(135deg,#0d1b2e,#c7cedd);" onclick="setTheme('blue')" title="نیلا و چاندی" aria-label="نیلا و چاندی تھیم"></button>
      <button class="theme-dot" data-theme="maroon" style="background:linear-gradient(135deg,#2c1015,#d4a24b);" onclick="setTheme('maroon')" title="مرون و سنہری" aria-label="مرون و سنہری تھیم"></button>
      <button class="theme-dot" data-theme="teal" style="background:linear-gradient(135deg,#082826,#d9895e);" onclick="setTheme('teal')" title="فیروزی و تانبا" aria-label="فیروزی و تانبا تھیم"></button>
      <button class="theme-dot" data-theme="charcoal" style="background:linear-gradient(135deg,#18191c,#5fc79a);" onclick="setTheme('charcoal')" title="سرمئی و سبز" aria-label="سرمئی و سبز تھیم"></button>
    </div>
  </div>
</header>

<div class="page-wrap">
  <a class="back-link" href="quran.html">→ واپس تمام سورتوں پر جائیں</a>

  <div class="surah-header">
    <div class="snum" id="s-num">1</div>
    <h2 id="s-name">سورہ نہیں ملی</h2>
    <div class="smeta" id="s-meta"></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="rukuu" onclick="switchTab('rukuu')">رکوع وار</button>
    <button class="tab-btn" data-tab="ayat" onclick="switchTab('ayat')">آیت وار</button>
  </div>

  <div class="audio-list" id="audio-list"></div>
</div>

<script>
/* =========================================================================
   EDITABLE CONFIG — یہاں ہر سورہ کے لیے آڈیوز شامل کریں۔
   نمبر 1 سے 114 تک سورہ کا نمبر ہے (فہرست ترتیب کے مطابق)۔
   ہر سورہ کے اندر دو حصے ہیں: rukuu (رکوع وار) اور ayat (آیت وار)۔
   ہر آڈیو کے لیے title خود لکھیں (جیسے "رکوع 1 — آیت 1 تا 7" یا "آیت 1")۔
   جس سورہ کا ڈیٹا شامل نہ کریں وہ خودکار طور پر خالی دکھائی جائے گی —
   اس لیے صرف اُن سورتوں کا اندراج کریں جن کی آڈیو تیار ہو۔
   ========================================================================= */
const SURAH_AUDIO = {
  1: { // الفاتحہ
    rukuu: [
      // { title: "رکوع 1 — مکمل سورہ", url: "https://drive.google.com/uc?export=download&id=FILE_ID" },
    ],
    ayat: [
      // { title: "آیت 1", url: "https://drive.google.com/uc?export=download&id=FILE_ID" },
      // { title: "آیت 2", url: "https://drive.google.com/uc?export=download&id=FILE_ID" },
    ]
  },
  // 2: { rukuu: [ ... ], ayat: [ ... ] },   // البقرہ
  // 3: { rukuu: [ ... ], ayat: [ ... ] },   // آل عمران
  // ... اسی طرح جس سورہ کی آڈیو تیار ہو اُس کا اندراج یہاں شامل کریں (نمبر 1 تا 114)
};
/* ========================= END EDITABLE CONFIG ========================= */

const surahs = [
["الفاتحہ",7,"مکی"],["البقرہ",286,"مدنی"],["آل عمران",200,"مدنی"],["النساء",176,"مدنی"],
["المائدہ",120,"مدنی"],["الأنعام",165,"مکی"],["الأعراف",206,"مکی"],["الأنفال",75,"مدنی"],
["التوبہ",129,"مدنی"],["یونس",109,"مکی"],["ھود",123,"مکی"],["یوسف",111,"مکی"],
["الرعد",43,"مدنی"],["ابراہیم",52,"مکی"],["الحجر",99,"مکی"],["النحل",128,"مکی"],
["الإسراء",111,"مکی"],["الکھف",110,"مکی"],["مریم",98,"مکی"],["طہٰ",135,"مکی"],
["الأنبیاء",112,"مکی"],["الحج",78,"مدنی"],["المؤمنون",118,"مکی"],["النور",64,"مدنی"],
["الفرقان",77,"مکی"],["الشعراء",227,"مکی"],["النمل",93,"مکی"],["القصص",88,"مکی"],
["العنکبوت",69,"مکی"],["الروم",60,"مکی"],["لقمان",34,"مکی"],["السجدہ",30,"مکی"],
["الأحزاب",73,"مدنی"],["سبإ",54,"مکی"],["فاطر",45,"مکی"],["یس",83,"مکی"],
["الصافات",182,"مکی"],["ص",88,"مکی"],["الزمر",75,"مکی"],["غافر",85,"مکی"],
["فصلت",54,"مکی"],["الشوریٰ",53,"مکی"],["الزخرف",89,"مکی"],["الدخان",59,"مکی"],
["الجاثیہ",37,"مکی"],["الأحقاف",35,"مکی"],["محمد",38,"مدنی"],["الفتح",29,"مدنی"],
["الحجرات",18,"مدنی"],["ق",45,"مکی"],["الذاریات",60,"مکی"],["الطور",49,"مکی"],
["النجم",62,"مکی"],["القمر",55,"مکی"],["الرحمٰن",78,"مدنی"],["الواقعہ",96,"مکی"],
["الحدید",29,"مدنی"],["المجادلہ",22,"مدنی"],["الحشر",24,"مدنی"],["الممتحنہ",13,"مدنی"],
["الصف",14,"مدنی"],["الجمعہ",11,"مدنی"],["المنافقون",11,"مدنی"],["التغابن",18,"مدنی"],
["الطلاق",12,"مدنی"],["التحریم",12,"مدنی"],["الملک",30,"مکی"],["القلم",52,"مکی"],
["الحاقہ",52,"مکی"],["المعارج",44,"مکی"],["نوح",28,"مکی"],["الجن",28,"مکی"],
["المزمل",20,"مکی"],["المدثر",56,"مکی"],["القیامہ",40,"مکی"],["الانسان",31,"مدنی"],
["المرسلات",50,"مکی"],["النبإ",40,"مکی"],["النازعات",46,"مکی"],["عبس",42,"مکی"],
["التکویر",29,"مکی"],["الإنفطار",19,"مکی"],["المطففین",36,"مکی"],["الإنشقاق",25,"مکی"],
["البروج",22,"مکی"],["الطارق",17,"مکی"],["الأعلیٰ",19,"مکی"],["الغاشیہ",26,"مکی"],
["الفجر",30,"مکی"],["البلد",20,"مکی"],["الشمس",15,"مکی"],["اللیل",21,"مکی"],
["الضحیٰ",11,"مکی"],["الشرح",8,"مکی"],["التین",8,"مکی"],["العلق",19,"مکی"],
["القدر",5,"مکی"],["البینہ",8,"مدنی"],["الزلزلہ",8,"مدنی"],["العادیات",11,"مکی"],
["القارعہ",11,"مکی"],["التکاثر",8,"مکی"],["العصر",3,"مکی"],["الھمزہ",9,"مکی"],
["الفیل",5,"مکی"],["قریش",4,"مکی"],["الماعون",7,"مکی"],["الکوثر",3,"مکی"],
["الکافرون",6,"مکی"],["النصر",3,"مدنی"],["المسد",5,"مکی"],["الإخلاص",4,"مکی"],
["الفلق",5,"مکی"],["الناس",6,"مکی"]
];

const params = new URLSearchParams(window.location.search);
const id = parseInt(params.get('id'), 10);
let currentTab = 'rukuu';

if(id >= 1 && id <= 114){
  const [name, ayat, place] = surahs[id - 1];
  document.getElementById('s-num').textContent = id;
  document.getElementById('s-name').textContent = 'سورہ ' + name;
  document.getElementById('s-meta').textContent = ayat + ' آیات — ' + place;
  document.title = 'سورہ ' + name + ' — الاحسان آن لائن اکیڈمی';
  renderList();
} else {
  document.getElementById('s-name').textContent = 'سورہ نہیں ملی';
  document.querySelector('.tabs').style.display = 'none';
  document.getElementById('audio-list').innerHTML = '<p class="empty-note">براہِ کرم آڈیو لائبریری میں سے کوئی سورہ منتخب کریں۔</p>';
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderList();
}

function renderList(){
  const holder = document.getElementById('audio-list');
  const data = SURAH_AUDIO[id] || { rukuu: [], ayat: [] };
  const items = data[currentTab] || [];
  if(!items.length){
    holder.innerHTML = '<p class="empty-note">اس حصے کی آڈیوز جلد شامل کی جائیں گی۔</p>';
    return;
  }
  holder.innerHTML = '';
  items.forEach(a => {
    const item = document.createElement('div');
    item.className = 'audio-item';
    item.innerHTML = `
      <span class="aname">${a.title}</span>
      <audio controls preload="none" src="${a.url}"></audio>
      <div class="audio-actions"><a class="icon-btn" href="${a.url}" download>⬇ ڈاؤن لوڈ</a></div>`;
    holder.appendChild(item);
  });
}

// ---- Color theme switcher (shared key 'ehsani-theme' across all pages) ----
function setTheme(name){
  if(name === 'default'){
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', name);
  }
  document.querySelectorAll('.theme-dot').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-theme') === name);
  });
  try{ sessionStorage.setItem('ehsani-theme', name); }catch(e){}
}
try{
  const saved = sessionStorage.getItem('ehsani-theme');
  if(saved) setTheme(saved);
}catch(e){}
</script>

</body>
</html>
