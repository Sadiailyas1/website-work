<!DOCTYPE html>
<html dir="rtl" lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کورس کا مواد — الاحسان آن لائن اکیڈمی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0f2a24; --bg-panel:#153931; --bg-panel-2:#1c463c;
    --gold:#c9a24b; --gold-soft:#e3c887; --cream:#f3ede0; --sage:#8fb3a4;
    --line:rgba(243,237,224,0.14); --header-bg:rgba(15,42,36,0.92); --radius:14px;
  }
  html[data-theme="blue"]{
    --bg-deep:#0d1b2e; --bg-panel:#132840; --bg-panel-2:#1a3454;
    --gold:#c7cedd; --gold-soft:#e7ebf3; --cream:#eef1f7; --sage:#8fa3c2;
    --line:rgba(238,241,247,0.14); --header-bg:rgba(13,27,46,0.92);
  }
  html[data-theme="maroon"]{
    --bg-deep:#2c1015; --bg-panel:#3a161c; --bg-panel-2:#4a1d24;
    --gold:#d4a24b; --gold-soft:#eac887; --cream:#f3e7e0; --sage:#c79488;
    --line:rgba(243,231,224,0.14); --header-bg:rgba(44,16,21,0.92);
  }
  html[data-theme="teal"]{
    --bg-deep:#082826; --bg-panel:#0e3a37; --bg-panel-2:#134b47;
    --gold:#d9895e; --gold-soft:#f0b28c; --cream:#eef3f1; --sage:#7fb6ad;
    --line:rgba(238,243,241,0.14); --header-bg:rgba(8,40,38,0.92);
  }
  html[data-theme="charcoal"]{
    --bg-deep:#18191c; --bg-panel:#212327; --bg-panel-2:#2b2e33;
    --gold:#5fc79a; --gold-soft:#8fe0bd; --cream:#eceeee; --sage:#8a9490;
    --line:rgba(236,238,238,0.14); --header-bg:rgba(24,25,28,0.92);
  }
  html[data-theme="light"]{
    --bg-deep:#f7faf8; --bg-panel:#ffffff; --bg-panel-2:#eaf3ee;
    --gold:#2f7d55; --gold-soft:#1f6a45; --cream:#1c2b24; --sage:#5f7568;
    --line:rgba(28,43,36,0.13); --header-bg:rgba(255,255,255,0.92);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{ background:var(--bg-deep); color:var(--cream); font-family:'Noto Naskh Arabic','Noto Nastaliq Urdu',serif; line-height:2; overflow-x:hidden; }
  h1,h2,h3,.nastaliq{font-family:'Noto Nastaliq Urdu',serif; font-weight:700;}

  header{ position:sticky; top:0; z-index:50; background:var(--header-bg); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .nav-wrap{ max-width:1180px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{ width:46px; height:46px; border-radius:50%; border:2px solid var(--gold); display:flex; align-items:center; justify-content:center; font-family:'Noto Nastaliq Urdu',serif; color:var(--gold-soft); font-size:20px; }
  .brand-name{font-family:'Noto Nastaliq Urdu',serif; font-size:22px; color:var(--gold-soft);}
  nav ul{list-style:none; display:flex; gap:28px; flex-wrap:wrap;}
  nav a{color:var(--cream); text-decoration:none; font-size:16px; opacity:.85; transition:opacity .2s, color .2s;}
  nav a:hover, nav a:focus-visible{opacity:1; color:var(--gold-soft);}
  .theme-switcher{ display:flex; align-items:center; gap:8px; }
  .theme-switcher span.ts-label{ font-size:12px; color:var(--sage); margin-left:2px; }
  .theme-dot{ width:22px; height:22px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; display:inline-block; transition:transform .15s, border-color .15s; }
  .theme-dot:hover{ transform:scale(1.12); }
  .theme-dot.active{ border-color:var(--cream); }

  .page-wrap{ max-width:900px; margin:0 auto; padding:50px 24px 90px; }
  .back-link{
    display:inline-flex; align-items:center; gap:8px; color:var(--gold-soft); text-decoration:none;
    font-size:15px; margin-bottom:26px; border:1px solid var(--line); padding:8px 18px; border-radius:999px; cursor:pointer;
  }
  .back-link:hover{border-color:var(--gold);}
  .cm-title{font-size:30px; color:var(--gold-soft); margin-bottom:8px;}
  .cm-duration{color:var(--sage); font-size:15px; margin-bottom:34px;}
  .cm-block{ background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius); padding:30px; margin-bottom:26px; }
  .cm-block h3{ color:var(--gold-soft); font-size:20px; margin-bottom:18px; }
  .pdf-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px; padding:16px 20px; }
  .pdf-row .pdf-label{display:flex; align-items:center; gap:12px; font-size:16px;}
  .pdf-icon{ width:40px; height:40px; border-radius:8px; background:var(--gold); color:#16302b; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; }
  .icon-btn{ display:flex; align-items:center; justify-content:center; gap:6px; background:var(--bg-panel-2); border:1px solid var(--line); color:var(--cream); border-radius:8px; padding:9px 14px; font-size:14px; cursor:pointer; text-decoration:none; font-family:inherit; transition:border-color .2s, color .2s; }
  .icon-btn:hover{border-color:var(--gold); color:var(--gold-soft);}
  .cm-audio-list{ display:flex; flex-direction:column; gap:14px; }
  .cm-audio-item{ background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px; padding:16px 20px; }
  .cm-audio-item .aname{ color:var(--gold-soft); font-size:16px; margin-bottom:8px; display:block; }
  .surah-actions{display:flex; gap:10px; margin-top:8px;}
  .empty-note{ color:var(--sage); font-size:14px; text-align:center; padding:14px; }
  audio{width:100%; margin-top:4px; height:34px;}
  ::selection{background:var(--gold); color:#16302b;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<header>
  <div class="nav-wrap">
    <div class="brand">
      <div class="brand-mark">ا</div>
      <div class="brand-name">الاحسان آن لائن اکیڈمی</div>
    </div>
    <nav>
      <ul>
        <li><a href="index.html#about">ہمارے بارے میں</a></li>
        <li><a href="index.html#courses">دورہ جات</a></li>
        <li><a href="quran.html">آڈیو لائبریری</a></li>
        <li><a href="index.html#register">رجسٹریشن</a></li>
      </ul>
    </nav>
    <div class="theme-switcher">
      <span class="ts-label">تھیم</span>
      <button class="theme-dot active" data-theme="default" style="background:linear-gradient(135deg,#0f2a24,#c9a24b);" onclick="setTheme('default')" title="سبز و سنہری" aria-label="سبز و سنہری تھیم"></button>
      <button class="theme-dot" data-theme="light" style="background:linear-gradient(135deg,#ffffff,#2f7d55);" onclick="setTheme('light')" title="سفید و سبز" aria-label="سفید و سبز تھیم"></button>
      <button class="theme-dot" data-theme="blue" style="background:linear-gradient(135deg,#0d1b2e,#c7cedd);" onclick="setTheme('blue')" title="نیلا و چاندی" aria-label="نیلا و چاندی تھیم"></button>
      <button class="theme-dot" data-theme="maroon" style="background:linear-gradient(135deg,#2c1015,#d4a24b);" onclick="setTheme('maroon')" title="مرون و سنہری" aria-label="مرون و سنہری تھیم"></button>
      <button class="theme-dot" data-theme="teal" style="background:linear-gradient(135deg,#082826,#d9895e);" onclick="setTheme('teal')" title="فیروزی و تانبا" aria-label="فیروزی و تانبا تھیم"></button>
      <button class="theme-dot" data-theme="charcoal" style="background:linear-gradient(135deg,#18191c,#5fc79a);" onclick="setTheme('charcoal')" title="سرمئی و سبز" aria-label="سرمئی و سبز تھیم"></button>
    </div>
  </div>
</header>

<div class="page-wrap">
  <a class="back-link" href="index.html#courses">→ واپس تمام کورسز پر جائیں</a>
  <h2 class="cm-title" id="cm-title">کورس نہیں ملا</h2>
  <div class="cm-duration" id="cm-duration"></div>

  <div class="cm-block">
    <h3>کورس کی PDF فائل</h3>
    <div id="cm-pdf-holder"></div>
  </div>

  <div class="cm-block">
    <h3>کورس کی آڈیوز</h3>
    <div class="cm-audio-list" id="cm-audio-holder"></div>
  </div>
</div>

<script>
/* =========================================================================
   EDITABLE CONFIG — یہاں ہر کورس کی PDF اور آڈیو لنکس شامل/تبدیل کریں
   pdfUrl خالی رکھنے پر "جلد شامل کی جائے گی" ظاہر ہوگا۔
   audios کی فہرست میں جتنے چاہیں سبق شامل کیے جا سکتے ہیں۔
   ========================================================================= */
const COURSES = {
  main: {
    title: "ترجمہ قرآن کورس",
    duration: "سال بھر جاری، سلسلہ وار کورس",
    pdfUrl: "",
    pdfLabel: "ترجمہ قرآن کورس — نصاب",
    audios: [
      // { title: "سبق 1", url: "https://example.com/materials/tarjuma/lesson1.mp3" },
    ]
  },
  short1: {
    title: "اسلامی عقائد کورس (حصہ اول)",
    duration: "15 روزہ، صرف 15 منٹ روزانہ",
    pdfUrl: "https://drive.google.com/uc?export=download&id=1pFTPFAHrgRYm-GLHCvopV8g3rJre_QL0",
    pdfLabel: "اسلامی عقائد کورس — حصہ اول",
    audios: [
        { title: " دین کی ضرورت - سبق 1", url: "https://drive.google.com/uc?export=download&id=1UloBTk0i2Kohz5lsUoX90xnpSAlLK-0X" },
       // { title: "سبق 1", url: "https://example.com/materials/tarjuma/lesson1.mp3" },
    ]
  },
  short2: {
    title: "اسلامی عقائد کورس (حصہ دوم)",
    duration: "10 روزہ، صرف 15 منٹ روزانہ",
    pdfUrl: "",
    pdfLabel: "اسلامی عقائد کورس — حصہ دوم",
    audios: []
  },
  short3: {
    title: "علمی عملی تجوید کورس",
    duration: "20 روزہ، صرف 15 منٹ روزانہ",
    pdfUrl: "",
    pdfLabel: "علمی عملی تجوید کورس",
    audios: []
  },
  short4: {
    title: "رمضان المبارک کورس (ایک آیت، ایک حدیث، ایک فقہی مسئلہ)",
    duration: "ایک ماہ، صرف 10 منٹ روزانہ",
    pdfUrl: "",
    pdfLabel: "رمضان المبارک کورس",
    audios: []
  },
  short5: {
    title: "عشرہ ذوالحج قربانی کورس",
    duration: "15 روزہ، صرف 15 منٹ روزانہ",
    pdfUrl: "",
    pdfLabel: "عشرہ ذوالحج قربانی کورس",
    audios: []
  },
  short6: {
    title: "صفر المظفر کورس",
    duration: "3 روزہ، صرف 15 منٹ روزانہ",
    pdfUrl: "",
    pdfLabel: "عشرہ المظفر کورس",
    audios: []
  }
};
/* ========================= END EDITABLE CONFIG ========================= */

const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const c = COURSES[id];

if(c){
  document.getElementById('cm-title').textContent = c.title;
  document.getElementById('cm-duration').textContent = c.duration;

  const pdfHolder = document.getElementById('cm-pdf-holder');
  if(c.pdfUrl){
    pdfHolder.innerHTML = `
      <div class="pdf-row">
        <span class="pdf-label"><span class="pdf-icon">PDF</span> ${c.pdfLabel || 'کورس نصاب'}</span>
        <div style="display:flex; gap:10px;">
          <a class="icon-btn" href="${c.pdfUrl}" target="_blank" rel="noopener">👁 دیکھیں</a>
          <a class="icon-btn" href="${c.pdfUrl}" download>⬇ ڈاؤن لوڈ</a>
        </div>
      </div>`;
  } else {
    pdfHolder.innerHTML = `<p class="empty-note">اس کورس کی PDF جلد شامل کی جائے گی۔</p>`;
  }

  const audioHolder = document.getElementById('cm-audio-holder');
  if(c.audios && c.audios.length){
    audioHolder.innerHTML = '';
    c.audios.forEach(a => {
      const item = document.createElement('div');
      item.className = 'cm-audio-item';
      item.innerHTML = `
        <span class="aname">${a.title}</span>
        <audio controls preload="none" src="${a.url}"></audio>
        <div class="surah-actions"><a class="icon-btn" href="${a.url}" download>⬇ ڈاؤن لوڈ</a></div>`;
      audioHolder.appendChild(item);
    });
  } else {
    audioHolder.innerHTML = `<p class="empty-note">اس کورس کی آڈیوز جلد شامل کی جائیں گی۔</p>`;
  }
} else {
  document.getElementById('cm-title').textContent = 'کورس نہیں ملا';
  document.getElementById('cm-duration').textContent = '';
  document.getElementById('cm-pdf-holder').innerHTML = `<p class="empty-note">براہِ کرم کورسز کی فہرست میں سے کوئی کورس منتخب کریں۔</p>`;
  document.getElementById('cm-audio-holder').innerHTML = '';
}

// ---- Color theme switcher (shared key 'ehsani-theme' across all pages) ----
function setTheme(name){
  if(name === 'default'){
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', name);
  }
  document.querySelectorAll('.theme-dot').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-theme') === name);
  });
  try{ sessionStorage.setItem('ehsani-theme', name); }catch(e){}
}
try{
  const saved = sessionStorage.getItem('ehsani-theme');
  if(saved) setTheme(saved);
}catch(e){}
</script>

</body>
</html>
